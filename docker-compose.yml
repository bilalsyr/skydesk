# SkyDroid — full Android phone in Docker, streamed to the browser.
# Services:
#   android : redroid (Android 12, 64-bit only) — the phone itself
#   scrcpy  : ws-scrcpy server (stream bridge) + tiny api (keys/screenshot/ping)
#   web     : Caddy reverse proxy with basic auth (public entry, port 80 only)

services:
  android:
    image: redroid/redroid:12.0.0_64only-latest
    privileged: true
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=280
      - androidboot.redroid_fps=30
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "getprop sys.boot_completed | grep -q 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  scrcpy:
    build: ./scrcpy
    depends_on:
      android:
        condition: service_healthy
    environment:
      - ADB_SERIAL=android:5555
      - WS_SCRCPY_PATHNAME=/s
      - API_PORT=8001
    healthcheck:
      test: ["CMD", "node", "/opt/healthcheck.js"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./play:/srv/play:ro
    environment:
      - SKY_HASH=${SKY_HASH}
    depends_on:
      scrcpy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
