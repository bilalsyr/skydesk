<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SkyDesk</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
       background:#0f172a;color:#e2e8f0;font-family:system-ui,"Noto Sans Arabic",sans-serif}
  .card{background:#1e293b;padding:32px;border-radius:16px;max-width:420px;width:90%;text-align:center}
  h1{margin:0 0 6px;font-size:28px} p{color:#94a3b8;margin:0 0 24px}
  button{display:block;width:100%;margin:10px 0;padding:14px;border:none;border-radius:10px;
    color:#fff;font-weight:600;font-size:16px;background:#334155;cursor:pointer;font-family:inherit}
  button.rec{background:#2563eb}
  small{display:block;font-weight:400;color:#cbd5e1;margin-top:4px}
  #viewer{position:fixed;inset:0;width:100vw;height:100dvh;border:0;display:none;background:#000}
</style>
</head>
<body>
<div class="card" id="menu">
  <h1>SkyDesk</h1>
  <p>اختر الوضع حسب سرعة الإنترنت عندك</p>
  <button class="rec" data-params="quality=2&compression=9">
    وضع النت الضعيف<small>أقل من 3 ميغا — صورة أخف وسرعة أعلى</small></button>
  <button data-params="quality=5&compression=6">
    وضع متوسط<small>3 إلى 10 ميغا</small></button>
  <button data-params="quality=8&compression=2">
    جودة عالية<small>أكثر من 10 ميغا</small></button>
</div>
<iframe id="viewer" title="SkyDesk desktop" allow="fullscreen"></iframe>
<script>
async function launch(btn){
  var params = btn.getAttribute('data-params');
  try {
    var el = document.documentElement;
    if (el.requestFullscreen) { await el.requestFullscreen(); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
  } catch(e){}
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape').catch(function(){});
    }
  } catch(e){}
  var src = 'vnc.html?autoconnect=true&resize=scale&reconnect=true&reconnect_delay=2000&show_dot=true&' + params;
  var viewer = document.getElementById('viewer');
  viewer.src = src;
  viewer.style.display = 'block';
  document.getElementById('menu').style.display = 'none';
}
document.querySelectorAll('#menu button').forEach(function(b){
  b.addEventListener('click', function(){ launch(b); });
});
</script>
</body>
</html>
